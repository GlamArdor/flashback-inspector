org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# From 26.1 Minecraft ships without obfuscation: no yarn or intermediary, Mojang's own names and
# Java 25. That is why this line cannot share a jar with the 1.21 build in the root.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.1

minecraft_range=>=26.3 <26.4

mod_version=1.0.6
maven_group=com.glamardor
archives_base_name=flashback-inspector

fabric_api_version=0.166.2+26.3
modmenu_version=21.0.1
cloth_config_version=26.3.159+fabric

# A folder with 26.3 mod jars, such as a modpack's mods folder: the dev client borrows real mod jars from it (26.x needs no remapping).
contik_mods=run/contik-mods

# Loom 1.19 runs only on a Java 25 Gradle JVM: run Gradle on JDK 25 or point org.gradle.java.home at one.

